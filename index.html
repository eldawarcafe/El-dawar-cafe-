<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24140e">
  <meta name="description" content="المنيو الإلكتروني لكافيه الدوار">
  <title>الدوار كافيه | El Dawar Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-shade"></div>
    <div class="brand">
      <img src="assets/logo.jpg" alt="شعار الدوار كافيه" class="logo">
      <p class="eyebrow">EL DAWAR CAFE</p>
      <h1>منيو الدوار كافيه</h1>
      <p class="welcome">اختار مشروبك واستمتع بوقتك</p>
    </div>
    <a class="scroll-link" href="#menu">اكتشف المنيو <span>↓</span></a>
  </header>

  <main id="menu" class="container">
    <div class="section-heading">
      <span class="gold-line"></span>
      <div>
        <p class="eyebrow">OUR MENU</p>
        <h2>قائمتنا</h2>
      </div>
      <span class="gold-line"></span>
    </div>

    <nav id="category-nav" class="category-nav" aria-label="أقسام المنيو"></nav>
    <div id="menu-content" class="menu-content" aria-live="polite"></div>
    <p class="notice">الأسعار بالجنيه المصري — اسألنا عن الأصناف المتاحة.</p>
  </main>

  <footer>
    <div class="footer-mark">الدوار كافيه</div>
    <p>أهلاً بيكم دايمًا ❤️</p>
    <small>EL DAWAR CAFE</small>
  </footer>
  <script src="menu.js"></script>
</body>
</html>
